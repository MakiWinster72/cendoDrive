services:
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cendo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: cendo
      DB_PASSWORD: ${MYSQL_PASSWORD:-cendo_dev_password}
      REDIS_HOST: redis
      FASTDFS_TRACKER: tracker:22122
      CENDO_STORAGE_ROOT: /app/storage
      CENDO_UPLOAD_ROOT: /app/storage/uploads
    volumes:
      - backend-storage:/app/storage
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage1:
        condition: service_started
      storage2:
        condition: service_started
      storage3:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

  mysql:
    image: mysql
    environment:
      MYSQL_DATABASE: cendo
      MYSQL_USER: cendo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cendo_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cendo_dev_root_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tracker:
    image: ygqygq2/fastdfs-nginx:latest
    entrypoint: ["/bin/sh", "/cendo/tracker-entrypoint.sh"]
    command: ["tracker"]
    environment:
      FDFS_RESERVED_STORAGE_SPACE: ${FDFS_RESERVED_STORAGE_SPACE:-5%}
    ports:
      - "127.0.0.1:22122:22122"
    volumes:
      - tracker-data:/var/fdfs
      - ./infra/fastdfs/tracker-entrypoint.sh:/cendo/tracker-entrypoint.sh:ro

  storage1:
    image: ygqygq2/fastdfs-nginx:latest
    command: ["storage"]
    environment: &storage-env
      TRACKER_SERVER: tracker:22122
    depends_on:
      - tracker
    ports:
      - "127.0.0.1:23000:23000"
      - "127.0.0.1:10001:8080"
    volumes:
      - storage1-data:/var/fdfs

  storage2:
    image: ygqygq2/fastdfs-nginx:latest
    command: ["storage"]
    environment: *storage-env
    depends_on:
      - tracker
    ports:
      - "127.0.0.1:23001:23000"
      - "127.0.0.1:10002:8080"
    volumes:
      - storage2-data:/var/fdfs

  storage3:
    image: ygqygq2/fastdfs-nginx:latest
    command: ["storage"]
    environment: *storage-env
    depends_on:
      - tracker
    ports:
      - "127.0.0.1:23002:23000"
      - "127.0.0.1:10003:8080"
    volumes:
      - storage3-data:/var/fdfs

volumes:
  backend-storage:
  mysql-data:
  redis-data:
  tracker-data:
  storage1-data:
  storage2-data:
  storage3-data:
