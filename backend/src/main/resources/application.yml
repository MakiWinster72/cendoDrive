spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://10.42.0.1:3306/cendo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:cendo}
    password: ${DB_PASSWORD:cendo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:10.42.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server:
  port: ${PORT:8080}
cendo:
  storage:
    root: ${CENDO_STORAGE_ROOT:./storage}
    backend: ${CENDO_STORAGE_BACKEND:fastdfs}
fdfs:
  tracker-list:
    - ${FASTDFS_TRACKER:127.0.0.1:22122}
  connect-timeout: 3000
  so-timeout: 30000
spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB
