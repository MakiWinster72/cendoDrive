spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cendo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:cendo}
    password: ${DB_PASSWORD:cendo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server:
  port: ${PORT:8080}
cendo:
  storage:
    root: ${CENDO_STORAGE_ROOT:./storage}
    backend: ${CENDO_STORAGE_BACKEND:fastdfs}
    cleanup-delay-ms: ${CENDO_STORAGE_CLEANUP_DELAY_MS:30000}
  upload:
    root: ${CENDO_UPLOAD_ROOT:./storage/uploads}
    ttl-hours: ${CENDO_UPLOAD_TTL_HOURS:24}
  ai:
    # Keep blank until Anna provides the internal service address. Pending tasks remain durable.
    enabled: ${CENDO_AI_ENABLED:false}
    base-url: ${ANNA_INDEX_BASE_URL:}
    worker-delay-ms: ${CENDO_AI_WORKER_DELAY_MS:5000}
fdfs:
  tracker-list:
    - ${FASTDFS_TRACKER:localhost:22122}
  connect-timeout: 3000
  so-timeout: 30000
spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB
